[project]
name = "edgemech"
version = "0.1.0"
description = "Pinned release-occurrence storage and native review eligibility"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "duckdb==2.0.0",
  "pyarrow==26.0.1",
  "pyyaml==6.0.3",
  "kg-microbe-orchestration @ git+https://github.com/CultureBotAI/culturebotai-claw.git@0ca25b8ee68d1fbccb4d05dcc2002fa8a64c0c34",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff==0.16.3"]

[project.scripts]
edgemech = "edgemech.__main__:main"

[build-system]
requires = ["setuptools>=81,<82"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edgemech = ["schema/*.yaml", "contract-pins.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
