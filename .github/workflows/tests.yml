name: EdgeMech contracts and storage
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen edgemech check-contracts
      - run: uv run --frozen ruff check src/edgemech tests scripts/adhoc
      - run: uv run --frozen pytest -q
      - run: uv build
